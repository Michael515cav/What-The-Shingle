<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What the Shingle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --slate: #1c2329; --slate-mid: #2d3a45; --slate-light: #3e5060;
    --gold: #c9a84c; --gold-light: #e2c97e;
    --cream: #f5f0e8; --cream-dark: #e8e0d0;
    --white: #ffffff; --red: #c0392b; --green: #27ae60; --muted: #8a9aa8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--slate); min-height: 100vh; }
  header { background: var(--slate); padding: 20px 32px; display: flex; align-items: center; gap: 14px; border-bottom: 2px solid var(--gold); }
  .brand-name { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--white); }
  .brand-name span { color: var(--gold); }
  .brand-tagline { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 18px 60px; display: flex; flex-direction: column; gap: 18px; }
  .screen { display: none; flex-direction: column; gap: 16px; }
  .screen.active { display: flex; }

  #uploadArea { background: var(--white); border: 2px dashed var(--cream-dark); border-radius: 12px; padding: 56px 24px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; display: block; }
  #uploadArea:hover { border-color: var(--gold); background: #fffdf7; }
  .upload-icon { width: 54px; height: 54px; margin: 0 auto 14px; background: var(--cream); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .upload-icon svg { width: 26px; height: 26px; stroke: var(--gold); fill: none; }
  .upload-title { font-family: 'DM Serif Display', serif; font-size: 1.35rem; color: var(--slate); margin-bottom: 8px; }
  .upload-sub { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }

  .loading-card { background: var(--white); border-radius: 12px; padding: 52px 24px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .spinner { width: 42px; height: 42px; border: 3px solid var(--cream-dark); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label { font-family: 'DM Serif Display', serif; font-size: 1.15rem; margin-bottom: 6px; }
  .loading-sub { font-size: 0.82rem; color: var(--muted); }
  .progress-steps { margin-top: 24px; display: flex; flex-direction: column; gap: 8px; max-width: 320px; margin-left: auto; margin-right: auto; }
  .progress-step { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--muted); }
  .progress-step.done { color: var(--green); }
  .progress-step.active { color: var(--slate); font-weight: 600; }
  .step-icon { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; flex-shrink: 0; }
  .progress-step.done .step-icon { background: var(--green); border-color: var(--green); color: white; }
  .progress-step.active .step-icon { border-color: var(--gold); }

  .result-header { background: var(--slate); border-radius: 12px; padding: 26px 28px; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .r-name { font-family: 'DM Serif Display', serif; font-size: 1.65rem; color: var(--white); line-height: 1.2; }
  .r-mfr { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
  .conf-row { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
  .conf-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .conf-track { flex: 1; height: 4px; background: var(--slate-light); border-radius: 2px; overflow: hidden; }
  .conf-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 1s ease; width: 0%; }
  .conf-pct { font-size: 0.78rem; font-weight: 600; color: var(--gold); min-width: 32px; text-align: right; }
  .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 100px; font-size: 0.78rem; font-weight: 600; flex-shrink: 0; }
  .status-badge.active { background: rgba(39,174,96,0.15); color: #4caf76; border: 1px solid rgba(39,174,96,0.3); }
  .status-badge.discontinued { background: rgba(192,57,43,0.15); color: #e05c4a; border: 1px solid rgba(192,57,43,0.3); }
  .status-badge.limited { background: rgba(201,168,76,0.15); color: var(--gold-light); border: 1px solid rgba(201,168,76,0.3); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-badge.active .status-dot { background: #4caf76; }
  .status-badge.discontinued .status-dot { background: #e05c4a; }
  .status-badge.limited .status-dot { background: var(--gold-light); }

  .identified-from { background: var(--slate-mid); border-radius: 9px; padding: 13px 16px; font-size: 0.8rem; color: #aab8c4; line-height: 1.5; }
  .identified-from strong { color: var(--gold); font-weight: 600; }

  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 11px; }
  .info-card { background: var(--white); border-radius: 9px; padding: 15px 17px; border: 1px solid var(--cream-dark); }
  .info-label { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 5px; }
  .info-val { font-size: 0.88rem; font-weight: 600; color: var(--slate); line-height: 1.4; }
  .notes-card { background: var(--white); border-radius: 0 9px 9px 0; padding: 18px 20px; border-left: 3px solid var(--gold); border-top: 1px solid var(--cream-dark); border-right: 1px solid var(--cream-dark); border-bottom: 1px solid var(--cream-dark); }
  .notes-card h4 { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 7px; }
  .notes-card p { font-size: 0.87rem; color: var(--slate-mid); line-height: 1.65; }
  .alt-card { background: var(--white); border-radius: 9px; padding: 18px 20px; border: 1px solid var(--cream-dark); }
  .alt-card h4 { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 11px; }
  .alt-item { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--cream-dark); }
  .alt-item:last-child { border-bottom: none; }
  .alt-swatch { width: 26px; height: 26px; border-radius: 5px; flex-shrink: 0; border: 1px solid var(--cream-dark); }
  .alt-name { font-size: 0.85rem; font-weight: 600; color: var(--slate); }
  .alt-mfr { font-size: 0.75rem; color: var(--muted); }
  .alt-reason { font-size: 0.73rem; color: var(--muted); margin-top: 1px; }
  .alt-avail { font-size: 0.73rem; font-weight: 600; color: var(--green); margin-left: auto; flex-shrink: 0; }
  .error-box { background: #fff5f5; border: 1px solid rgba(192,57,43,0.25); border-radius: 9px; padding: 16px 20px; color: var(--red); font-size: 0.875rem; line-height: 1.55; }
  .btn-ghost { display: inline-flex; align-items: center; gap: 6px; background: none; color: var(--muted); border: 1px solid var(--cream-dark); border-radius: 8px; padding: 11px 18px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; transition: border-color 0.2s, color 0.2s; margin-top: 4px; }
  .btn-ghost:hover { border-color: var(--slate-light); color: var(--slate); }
  @media (max-width: 560px) { .result-header { flex-direction: column; } }
</style>
</head>
<body>
<header>
  <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
    <rect width="40" height="40" rx="8" fill="#2d3a45"/>
    <path d="M6 22L20 10L34 22" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 22v10h20V22" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 32v-6h8v6" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div>
    <div class="brand-name">What the <span>Shingle</span></div>
    <div class="brand-tagline">AI Identification for Roofing Pros</div>
  </div>
</header>
<main>

  <div id="sUpload" class="screen active">
    <label id="uploadArea" for="fileInput">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
      <div class="upload-title">Upload a shingle photo</div>
      <div class="upload-sub">JPG, PNG, or HEIC · Google Vision + AI identifies it automatically</div>
    </label>
    <input type="file" id="fileInput" accept="image/*,.heic,.heif" style="display:none">
    <div id="upErr" class="error-box" style="display:none"></div>
  </div>

  <div id="sLoading" class="screen">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-label" id="loadingLabel">Analyzing photo…</div>
      <div class="loading-sub" id="loadingSub">This takes about 5 seconds</div>
      <div class="progress-steps">
        <div class="progress-step" id="step1">
          <div class="step-icon">1</div> Sending to Google Vision API
        </div>
        <div class="progress-step" id="step2">
          <div class="step-icon">2</div> Identifying shingle from web matches
        </div>
        <div class="progress-step" id="step3">
          <div class="step-icon">3</div> Researching specs &amp; availability
        </div>
      </div>
    </div>
  </div>

  <div id="sResults" class="screen">
    <div class="result-header">
      <div style="flex:1">
        <div class="r-name" id="rName"></div>
        <div class="r-mfr" id="rMfr"></div>
        <div class="conf-row">
          <span class="conf-label">Confidence</span>
          <div class="conf-track"><div class="conf-fill" id="confFill"></div></div>
          <span class="conf-pct" id="confPct"></span>
        </div>
      </div>
      <div id="statusBadge" class="status-badge"></div>
    </div>
    <div class="identified-from" id="identifiedFrom" style="display:none">
      <strong>Identified via:</strong> <span id="identifiedFromText"></span>
    </div>
    <div class="info-grid" id="infoGrid"></div>
    <div class="notes-card" id="notesCard" style="display:none"><h4>Field Notes</h4><p id="notesText"></p></div>
    <div class="alt-card" id="altCard" style="display:none"><h4>Compatible Alternatives</h4><div id="altList"></div></div>
    <button class="btn-ghost" id="resetBtn">← Analyze another shingle</button>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script>
let b64 = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setStep(n) {
  [1,2,3].forEach(i => {
    const el = document.getElementById('step' + i);
    el.classList.remove('done','active');
    if (i < n) { el.classList.add('done'); el.querySelector('.step-icon').textContent = '✓'; }
    else if (i === n) { el.classList.add('active'); }
  });
}

async function loadFile(file) {
  if (!file) return;
  document.getElementById('upErr').style.display = 'none';
  const name = file.name.toLowerCase();
  const isHeic = name.endsWith('.heic') || name.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif';
  let blob = file;
  if (isHeic) {
    try {
      blob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.85 });
      if (Array.isArray(blob)) blob = blob[0];
    } catch(e) {
      document.getElementById('upErr').textContent = 'HEIC conversion failed. Please convert to JPG first.';
      document.getElementById('upErr').style.display = 'block';
      return;
    }
  }
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      b64 = cv.toDataURL('image/jpeg', 0.85).split(',')[1];
      runPipeline();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(blob);
}

async function runPipeline() {
  show('sLoading');
  setStep(1);

  try {
    // STEP 1: Google Vision
    document.getElementById('loadingLabel').textContent = 'Scanning with Google Vision…';
    document.getElementById('loadingSub').textContent = 'Finding web matches for your shingle';
    const visionRes = await fetch('/api/identify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'vision', image: b64 })
    });
    const visionData = await visionRes.json();
    if (visionData.error) throw new Error('Vision API: ' + visionData.error.message);

    // STEP 2: Claude research
    setStep(2);
    document.getElementById('loadingLabel').textContent = 'Identifying shingle…';
    document.getElementById('loadingSub').textContent = 'Matching against manufacturer database';
    await new Promise(r => setTimeout(r, 400));

    setStep(3);
    document.getElementById('loadingLabel').textContent = 'Pulling full specs…';
    document.getElementById('loadingSub').textContent = 'Checking availability, warranty, and alternatives';

    const claudeRes = await fetch('/api/identify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'research', shingleName: visionData })
    });
    const result = await claudeRes.json();
    if (result.error) throw new Error('Research: ' + result.error.message);

    render(result);

  } catch(e) {
    show('sUpload');
    document.getElementById('upErr').textContent = 'Error: ' + e.message;
    document.getElementById('upErr').style.display = 'block';
  }
}

document.getElementById('fileInput').addEventListener('change', function() { if(this.files[0]) loadFile(this.files[0]); this.value=''; });
document.getElementById('resetBtn').addEventListener('click', () => { b64 = null; show('sUpload'); });

function render(r) {
  document.getElementById('rName').textContent = r.productName || 'Unknown';
  document.getElementById('rMfr').textContent = r.manufacturer || '';
  const conf = Math.min(100, Math.max(0, +r.confidence || 0));
  setTimeout(() => document.getElementById('confFill').style.width = conf + '%', 80);
  document.getElementById('confPct').textContent = conf + '%';

  const av = (r.availability || 'active').toLowerCase();
  const badge = document.getElementById('statusBadge');
  badge.className = 'status-badge ' + (av === 'discontinued' ? 'discontinued' : av === 'limited' ? 'limited' : 'active');
  badge.innerHTML = `<span class="status-dot"></span>${av === 'discontinued' ? 'Discontinued' : av === 'limited' ? 'Limited' : 'Available'}`;

  if (r.identifiedFrom) {
    document.getElementById('identifiedFromText').textContent = r.identifiedFrom;
    document.getElementById('identifiedFrom').style.display = 'block';
  } else document.getElementById('identifiedFrom').style.display = 'none';

  const grid = document.getElementById('infoGrid');
  grid.innerHTML = '';
  [
    ['Color / Style', r.colorStyle], ['Type', r.shingleType], ['Material', r.material],
    ['Dimensions', r.dimensions], ['Warranty', r.warrantyOriginal], ['Weight / Square', r.weightPerSquare],
    ['Wind Rating', r.windRating], ['Fire Rating', r.fireRating], ['Price / Square', r.pricePerSquare],
    ['Where to Buy', r.whereToBuy], ['Discontinued', r.discontinuedYear], ['Replaced By', r.replacedBy]
  ].forEach(([l, v]) => {
    if (!v || v === 'null') return;
    const d = document.createElement('div'); d.className = 'info-card';
    d.innerHTML = `<div class="info-label">${l}</div><div class="info-val">${v}</div>`;
    grid.appendChild(d);
  });

  const nc = document.getElementById('notesCard');
  if (r.fieldNotes) { document.getElementById('notesText').textContent = r.fieldNotes; nc.style.display = 'block'; }
  else nc.style.display = 'none';

  const ac = document.getElementById('altCard'), al = document.getElementById('altList');
  al.innerHTML = '';
  if (r.alternatives && r.alternatives.length) {
    r.alternatives.forEach(a => {
      const el = document.createElement('div'); el.className = 'alt-item';
      el.innerHTML = `<div class="alt-swatch" style="background:${a.colorHex||'#aaa'}"></div>
        <div><div class="alt-name">${a.productName} <span class="alt-mfr">· ${a.manufacturer}</span></div><div class="alt-reason">${a.reason}</div></div>
        <div class="alt-avail">${a.available ? 'In stock' : 'Check avail.'}</div>`;
      al.appendChild(el);
    });
    ac.style.display = 'block';
  } else ac.style.display = 'none';

  show('sResults');
}
</script>
</body>
</html>
